name: Build Moroger Mela APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app folder and correct website URL
        run: |
          unzip -o app.zip -d .
          JAVA_FILE=$(find app -name MainActivity.java -print -quit)
          test -n "$JAVA_FILE"
          sed -i 's#private static final String APP_URL = .*;#private static final String APP_URL = "https://preview-xte9zt.v2.appdeploy.ai/";#' "$JAVA_FILE"
          grep -n 'APP_URL' "$JAVA_FILE"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moroger-Mela-APK
          path: app/build/outputs/apk/debug/*.apk
